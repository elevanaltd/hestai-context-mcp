# TEMPORARY DIAGNOSTIC - removed before this PR is reviewed.
#
# Measures what the default GITHUB_TOKEN can see about a comment author:
# the collaborator permission endpoint and authorAssociation. The two jobs
# mirror the permission blocks of review-gate.yml (job `check-review`) and
# review-gate-caller.yml.template, so the result reflects the token the
# review validator actually runs with.
name: Token visibility diagnostic (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review-gate-job-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe permission and author association
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "repository=${GITHUB_REPOSITORY} event=${GITHUB_EVENT_NAME}"
          for login in shaunbuswell cubic-dev-ai 'cubic-dev-ai[bot]' octocat; do
            echo "=== collaborator permission: ${login}"
            gh api "repos/{owner}/{repo}/collaborators/${login}/permission" \
              --jq '{permission, role_name, user_login: .user.login, user_type: .user.type}' 2>&1
            echo "exit=$?"
          done
          echo "=== org membership visibility: shaunbuswell"
          gh api -i "orgs/${GITHUB_REPOSITORY_OWNER}/members/shaunbuswell" 2>&1 | head -1
          echo "=== authorAssociation via gh pr view --json comments,reviews (PR 301)"
          gh pr view 301 --json comments,reviews \
            --jq '[.comments[], .reviews[]] | map({login: .author.login, assoc: .authorAssociation}) | unique' 2>&1
          echo "exit=$?"
          echo "=== author_association via REST issue comments (PR 301)"
          gh api "repos/{owner}/{repo}/issues/301/comments" \
            --jq 'map({login: .user.login, type: .user.type, assoc: .author_association}) | unique' 2>&1
          echo "exit=$?"
          echo "=== author_association via REST reviews (PR 301)"
          gh api "repos/{owner}/{repo}/pulls/301/reviews" \
            --jq 'map({login: .user.login, type: .user.type, assoc: .author_association}) | unique' 2>&1
          echo "exit=$?"

  caller-template-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe permission and author association
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "repository=${GITHUB_REPOSITORY} event=${GITHUB_EVENT_NAME}"
          for login in shaunbuswell cubic-dev-ai 'cubic-dev-ai[bot]' octocat; do
            echo "=== collaborator permission: ${login}"
            gh api "repos/{owner}/{repo}/collaborators/${login}/permission" \
              --jq '{permission, role_name, user_login: .user.login, user_type: .user.type}' 2>&1
            echo "exit=$?"
          done
          echo "=== org membership visibility: shaunbuswell"
          gh api -i "orgs/${GITHUB_REPOSITORY_OWNER}/members/shaunbuswell" 2>&1 | head -1
          echo "=== authorAssociation via gh pr view --json comments,reviews (PR 301)"
          gh pr view 301 --json comments,reviews \
            --jq '[.comments[], .reviews[]] | map({login: .author.login, assoc: .authorAssociation}) | unique' 2>&1
          echo "exit=$?"
          echo "=== author_association via REST issue comments (PR 301)"
          gh api "repos/{owner}/{repo}/issues/301/comments" \
            --jq 'map({login: .user.login, type: .user.type, assoc: .author_association}) | unique' 2>&1
          echo "exit=$?"
          echo "=== author_association via REST reviews (PR 301)"
          gh api "repos/{owner}/{repo}/pulls/301/reviews" \
            --jq 'map({login: .user.login, type: .user.type, assoc: .author_association}) | unique' 2>&1
          echo "exit=$?"
